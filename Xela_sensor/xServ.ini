[CAN]
bustype = socketcan
channel = can0
[viz]
# NOTE: comments are on their own lines, NOT trailing after a value. Python's
# configparser does not strip inline comments unless explicitly configured, in
# which case `grid = on #use ...` parses as the literal string "on #use ..."
# and the setting silently does nothing. The shipped defaults were all written
# that way, so some may never have taken effect.

# How far a bubble travels at full shear signal (100 = one taxel gap).
# Raised: this sensor's useful shear range sits well below full scale, so at
# 100 real shear is a barely visible wobble.
max_offset = 150
# Bubble growth under normal (Z) load, same 100 = one taxel gap scale.
max_size = 130
# Draw origin -> current position vectors. This is the setting that makes
# SHEAR visible at all - without it, X/Y displacement is nearly impossible to
# read off bubble positions alone.
arrows = full
grid = on
# Reference dots at each taxel's rest position, so arrow length reads as
# actual displacement rather than absolute position.
origins = on
# Lets overlapping bubbles both stay readable - which is exactly what you need
# to see, since load spreading to neighbours is this sensor's defining
# behaviour. CPU-heavy without a dedicated GPU; this machine has an NVIDIA
# card, so it is fine here.
transparency = on
# Sensor update rate. Worth having on during calibration runs: if the CAN
# stream stalls mid-sweep, the counter shows it immediately, whereas a frozen
# bubble field looks identical to "nothing is touching the sensor".
ups = on
# Only enable if the viz itself feels sluggish (it measures redraw, not data).
fps = off
temp_show = on
[debug]
sens_print = full
[sensor]
num_of_sensor = 1
model = XR1944
version = 1
id = 3
